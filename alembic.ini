# Alembic. The DSN is deliberately ABSENT -- see `db/alembic/env.py`: it comes
# from `Settings` (`VENONA_DATABASE_URL`), because a URL in this file would be a
# second place to configure the database and the one people edit is always the
# other one.
[alembic]
script_location = backend/venona/db/alembic
# Explicit, because Alembic 1.16 deprecated the legacy split on spaces, commas
# AND colons -- a path containing any of those was silently torn in three.
path_separator = os
prepend_sys_path = backend

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
