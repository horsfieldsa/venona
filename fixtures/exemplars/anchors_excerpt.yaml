edges:
  # ── US executive branch ────────────────────────────────────────────
  - { src: govt:defense-department, predicate: BASED_IN, dst: country:united-states }
  - { src: govt:white-house, predicate: BASED_IN, dst: country:united-states }
  - { src: govt:department-of-homeland-security, predicate: BASED_IN, dst: country:united-states }
  - { src: govt:national-aeronautics-and-space-administration, predicate: BASED_IN, dst: country:united-states }
  - { src: govt:government-accountability-office, predicate: BASED_IN, dst: country:united-states }
  - { src: govt:u-s-department-of-commerce, predicate: BASED_IN, dst: country:united-states }
  - { src: govt:national-institute-of-standards-and-technology, predicate: PART_OF, dst: govt:u-s-department-of-commerce, kind: org_hierarchy }
  - { src: govt:cybersecurity-and-infrastructure-security-agency, predicate: PART_OF, dst: govt:department-of-homeland-security, kind: org_hierarchy }

  # ── services under the department ──────────────────────────────────
  - { src: unit:u-s-army, predicate: PART_OF, dst: govt:defense-department, kind: org_hierarchy }
  - { src: unit:u-s-navy, predicate: PART_OF, dst: govt:defense-department, kind: org_hierarchy }
  - { src: unit:u-s-air-force, predicate: PART_OF, dst: govt:defense-department, kind: org_hierarchy }
  - { src: unit:u-s-space-force, predicate: PART_OF, dst: govt:defense-department, kind: org_hierarchy }
  - { src: unit:marine-corps, predicate: PART_OF, dst: govt:defense-department, kind: org_hierarchy }

  # ── agencies and combatant commands under the department ───────────
  - { src: govt:defense-advanced-research-projects-agency, predicate: PART_OF, dst: govt:defense-department, kind: org_hierarchy }
  - { src: govt:defense-innovation-unit, predicate: PART_OF, dst: govt:defense-department, kind: org_hierarchy }
  - { src: govt:space-development-agency, predicate: PART_OF, dst: govt:defense-department, kind: org_hierarchy }
  - { src: govt:missile-defense-agency, predicate: PART_OF, dst: govt:defense-department, kind: org_hierarchy }
  - { src: govt:national-reconnaissance-office, predicate: PART_OF, dst: govt:defense-department, kind: org_hierarchy }
  - { src: govt:chief-digital-and-artificial-intelligence-office, predicate: PART_OF, dst: govt:defense-department, kind: org_hierarchy }
  - { src: unit:us-central-command, predicate: PART_OF, dst: govt:defense-department, kind: org_hierarchy }
  - { src: unit:joint-interagency-task-force-south-jiatf-s, predicate: PART_OF, dst: unit:us-central-command, kind: joint }

  # ── formations under their service ─────────────────────────────────
  - { src: unit:i-corps, predicate: PART_OF, dst: unit:u-s-army, kind: org_hierarchy }
  - { src: unit:4th-infantry-division, predicate: PART_OF, dst: unit:u-s-army, kind: org_hierarchy }
  - { src: unit:25th-infantry-divisions, predicate: PART_OF, dst: unit:u-s-army, kind: org_hierarchy }
  - { src: unit:space-systems-command, predicate: PART_OF, dst: unit:u-s-space-force, kind: org_hierarchy }
  - { src: unit:air-force-test-pilot-school, predicate: PART_OF, dst: unit:u-s-air-force, kind: org_hierarchy }

ambiguous:
  - { surface: SDA, reason: "Space Development Agency vs software-defined anything" }
  - { surface: TITAN, reason: "Army TITAN program vs commercial product names" }
  - { surface: EW, reason: "electronic warfare vs early warning" }
  - { surface: Sentinel, reason: "multiple programs and products" }
  - { surface: Atlas, reason: "multiple programs and products" }

  # Bare institutional words, each of which minted an entity naming no
  # particular body: `org:defence` reached ACTIVE and absorbed "Australian
  # Defence Force" as a conflict; `org:the-air-force` coined the alias "TAF".
  # The corpus already holds five different air forces and navies.
  - { surface: Defence, reason: "names no particular ministry or service" }
  - { surface: Defense, reason: "names no particular ministry or service" }
  - { surface: the Navy, reason: "US, Royal, German -- the article decides" }
  - { surface: the Army, reason: "US, Australian, Ukrainian -- the article decides" }
  - { surface: the Air Force, reason: "US, Italian, Ukrainian -- the article decides" }

  # New in v3: each minted an Organization and each is a category error -- a
  # publisher we read, a conference, a city hosting a depot. Belt to the
  # ontology guidance's braces.
  - { surface: War on the Rocks, reason: "a publisher we read, not an actor" }
  - { surface: Breaking Defense, reason: "a publisher we read, not an actor" }
  - { surface: DefenseScoop, reason: "a publisher we read, not an actor" }
  - { surface: Forge, reason: "multiple products and program offices" }
  - { surface: Hunter, reason: "multiple programs and products" }
