# venona anchors -- the top level of the graph. USER-EDITABLE.
#
# The corpus gives you the leaves and almost never the trunk: no article states
# that the Army is part of the Defense Department. Declaring it here is what
# turns 109 disconnected islands into a graph you can navigate from a country.
#
# Loaded by `venona anchors load`, independently of `fixtures/seed/` -- that
# fixture also ships fake documents which must never reach a live database.
# Everything here is `method='seed'`: never demoted, and evidence for nothing.
#
# ── two rules ────────────────────────────────────────────────────────
#
# 1. DECLARE ONLY IDS THAT DO NOT EXIST. Attach existing entities in `edges:`
#    by id; a re-declaration overwrites name, summary and relevance.
# 2. EVERY EDGE IS TYPE-CHECKED against config/ontology.yaml at load time. If
#    the loader rejects a line, the ontology disagrees with you -- read it.
#
# `PART_OF` is the org chart (child -> parent); `BASED_IN` is nationality
# (organisation -> country). Separate, because a country inside PART_OF would
# put a supernode in the middle of every path query.

entities:
  # ── countries ──────────────────────────────────────────────────────
  # `name_strictness: 0` throughout: an anchor's job is structural, not
  # annotation, and at the default "United States" wins the highlight over
  # `U.S. Army` across two thirds of the corpus.
  - id: country:united-states
    type: Country
    name: United States
    name_strictness: 0
    relevance: 0.3
    summary: Sponsor above the Defense Department, and the jurisdiction of US-domiciled industry.
    aliases:
      - { surface: U.S., strictness: 0 }
      - { surface: USA, strictness: 0 }
      - { surface: United States of America, strictness: 0 }

  - id: country:china
