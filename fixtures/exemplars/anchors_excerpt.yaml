  # ── the bodies the edges below actually name ───────────────────────
  # Every endpoint in `edges:` is declared HERE, because that is the rule the
  # file is held to: an edge naming something undeclared is dropped, silently
  # and completely. An excerpt that broke its own rule taught the shape of a
  # document that loses all of its structure on load.

