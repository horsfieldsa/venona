  # ── discovery sweeps ───────────────────────────────────────────────
  # These search rather than fetching an endpoint, so they carry no `url`, and
  # return candidate URLs the ordinary fetch path then fetches and dedups.
  #
  # One source per area, so each gets its own health, strikes, `enabled` switch
  # and model for free. `tags` are the search targets; the wording lives in
  # `profile/research_prompt.md` under the matching heading. `model` overrides
  # `llm.discover_model` -- the two areas closest to the thesis get opus.
  - id: sweep_edge_ai
    name: "Sweep: edge AI & autonomy"
    kind: discovery
    model: opus
    max_items: 10
    tags: [edge_inference, on_device_ml, sensor_fusion, ddil, autonomy_stacks, counter_signals]

  - id: sweep_c2
    name: "Sweep: command & control"
    kind: discovery
    model: opus
    max_items: 10
    tags: [ngc2, jadc2, cjadc2, abms, project_convergence, ibcs, titan, maven_smart_system]

  - id: sweep_uas
    name: "Sweep: UAS, drone & counter-UAS"
    kind: discovery
    max_items: 8
    tags: [skyfoundry, lasso, group_1_3_uas, counter_uas, fs_lids, m_lids, coyote, ngcm, replicator]

  - id: sweep_undersea
    name: "Sweep: undersea & maritime autonomy"
    kind: discovery
    max_items: 8
    tags: [xluuv, orca, lusv, musv, ghost_shark, dive_xl, mine_countermeasures, aukus_pillar_2]

  - id: sweep_space
    name: "Sweep: space & satellite"
    kind: discovery
    max_items: 8
    tags: [sda_tranches, golden_dome, sb_amti, gmti, proliferated_leo, on_orbit_processing]

  - id: sweep_programs
    name: "Sweep: service technology programs"
    kind: discovery
    max_items: 8
    tags: [army, navy, air_force, marine_corps, space_force, socom, diu, cdao, acquisition_reform]

  - id: sweep_competitors
    name: "Sweep: competitors & market"
    kind: discovery
    max_items: 8
    tags: [anduril, palantir, shield_ai, scale_ai, applied_intuition, govini, saronic, skydio]

  - id: sweep_allied
    name: "Sweep: international & allied"
    kind: discovery
    max_items: 6
    tags: [nato, aukus, five_eyes, uk, australia, japan, ukraine_lessons]

# Probed and rejected. Kept so nobody spends an afternoon rediscovering why.
removed:
  - url: https://www.army.mil/rss/static/1.xml
    reason: HTTP 403 to any non-browser client.

  - url: https://www.peoc3n.army.mil/News
    reason: >-
      TLS certificate does not validate against the public trust store (DoD PKI).
      Would need the DoD root CA bundle installed to fetch at all.

  - url: https://www.defense.gov/News/Contracts/
    reason: >-
      The RSS index works, but every article body returns 403 to both an honest
      UA and a Chrome UA, and the feed <description> is a 61-character stub. No
      content path. This is genuinely high-signal -- revisit with a different
      access route rather than pretending the scraper works.

  - url: https://www.anduril.com/news/
    reason: >-
      Shader-driven SPA. The served HTML contains zero content links, only
      app.js and shader files. Needs a JSON-payload adapter, not CSS selectors.

  - url: https://investors.palantir.com/rss/pressrelease.aspx
    reason: >-
      302-redirects to palantir.com/404. Probed OK during design and was dead
      days later -- which is precisely why source_health exists. Vendor IR feeds
      move often; prefer trade press coverage of vendors over vendor feeds.

  - url: https://www.diu.mil/latest
    reason: >-
      Next.js. Content lives in the __NEXT_DATA__ JSON blob, not the DOM. Same
      adapter gap as Anduril.
