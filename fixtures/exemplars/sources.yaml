# Source declarations (contract C9). USER-EDITABLE.
#
# Adding a source is a change to THIS FILE plus a recorded fixture -- no Python.
# A pydantic model validates at startup, so a bad `kind` fails on boot. Every
# URL here was probed live; `removed:` at the bottom records what did not work.

defaults:
  max_items: 40
  fetch_body: true

sources:
  # ── trade press ────────────────────────────────────────────────────
