      - { surface: mesh network, strictness: 3 }

  - id: tech:electronic-warfare
    type: Technology
    name: Electronic Warfare
    expansion: EW
    relevance: 0.7
    aliases:
      # EW is ambiguous (electronic warfare vs early warning); never auto-match.
      - { surface: EW, strictness: 0, is_acronym: true }
      - { surface: electronic warfare, strictness: 3 }

  - id: tech:computer-vision
    type: Technology
    name: Computer Vision
    relevance: 0.85
    aliases:
      - { surface: computer vision, strictness: 3 }

  - id: tech:sensor-fusion
    type: Technology
    name: Sensor Fusion
    relevance: 0.9
    aliases:
      - { surface: sensor fusion, strictness: 3 }

  - id: tech:modular-open-systems-approach
    type: Technology
    name: Modular Open Systems Approach
    expansion: MOSA
    summary: Acquisition and design approach mandating open interfaces so components can be swapped.
    relevance: 0.7
    aliases:
      - { surface: MOSA, strictness: 2, is_acronym: true }

  # ── Platforms ──────────────────────────────────────────────────────
  - id: plat:lattice
    type: Platform
    name: Lattice
    platform_type: software
    summary: Anduril's autonomy and command-and-control software platform.
    relevance: 0.9
    produced_by: company:anduril-industries
    aliases:
      - { surface: Lattice, strictness: 3 }

  - id: plat:ghost-x
    type: Platform
    name: Ghost-X
    platform_type: uas
    relevance: 0.6
    produced_by: company:anduril-industries
    aliases:
      - { surface: Ghost-X, strictness: 2 }

  - id: plat:maven-smart-system-platform
    type: Platform
    name: Maven Smart System
    platform_type: software
    relevance: 0.8
    produced_by: company:palantir-technologies
    aliases:
      - { surface: Maven Smart System, strictness: 3 }
      - { surface: Maven, strictness: 1 }

  # ── People ─────────────────────────────────────────────────────────
  - id: person:alex-miller
    type: Person
    name: Alex Miller
    summary: Army CTO, frequently quoted on NGC2 architecture direction.
    relevance: 0.6
    works_for: unit:u-s-army
    aliases:
      - { surface: Alex Miller, strictness: 3 }

# Surfaces with more than one plausible owner. Never auto-matched; the hover
# card shows a disambiguation list instead of guessing.
ambiguous:
  - { surface: SDA, reason: "Space Development Agency vs software-defined anything" }
  - { surface: TITAN, reason: "Army TITAN program vs commercial product names" }
  - { surface: EW, reason: "electronic warfare vs early warning" }
  - { surface: Sentinel, reason: "multiple programs and products" }
  - { surface: Atlas, reason: "multiple programs and products" }

  # Bare institutional words, each of which minted an entity naming no
  # particular body: `org:defence` reached ACTIVE and absorbed "Australian
  # Defence Force" as a conflict; `org:the-air-force` coined the alias "TAF".
  # The corpus already holds five different air forces and navies. Keep in step
  # with `profile/anchors.yaml`, which carries the same list.
  - { surface: Defence, reason: "names no particular ministry or service" }
  - { surface: Defense, reason: "names no particular ministry or service" }
  - { surface: the Navy, reason: "US, Royal, German -- the article decides" }
  - { surface: the Army, reason: "US, Australian, Ukrainian -- the article decides" }
  - { surface: the Air Force, reason: "US, Italian, Ukrainian -- the article decides" }
