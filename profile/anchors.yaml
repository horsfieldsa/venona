# No `merges:` block: v3 split Organization on an empty database, so no `org:`
# id was ever minted and there is nothing to retype. The machinery still exists
# and is still right next time -- `venona anchors load --apply-merges`.

# Surfaces with more than one plausible owner. Never auto-matched on the name
# alone, and checked BEFORE the exact-alias rung, so this outranks every alias
# below.
#
# `readings:` is optional and changes what happens when the surface appears. A
# surface without it declines, always, and the mention is lost to both meanings.
# With it, the resolver looks for the one reading THIS document names -- the
# full title, or the country it is based in -- and takes it only when exactly
# one is present. Two named, or none, and it declines exactly as before. So the
# failure mode stays a missing mention rather than a wrong one, which is the
# whole reason the surface is on this list.
#
# List a reading even when it is uncorroborated: an entity that is not active
# yet is skipped rather than picked, and the line starts working the day it is
# promoted.
#
# DUPLICATED in `fixtures/seed/entities.yaml` on purpose: the fixture serves
# `make reset`, this serves `make bootstrap`, and an instance built from anchors
# alone would otherwise start with the resolver's first guard empty. Add to both.
ambiguous:
  - { surface: SDA, reason: "Space Development Agency vs software-defined anything" }
  - { surface: TITAN, reason: "Army TITAN program vs commercial product names" }
  - { surface: EW, reason: "electronic warfare vs early warning" }
  - { surface: Sentinel, reason: "multiple programs and products" }
  - { surface: Atlas, reason: "multiple programs and products" }

  # Bare institutional words, each of which minted an entity naming no
  # particular body: `org:defence` reached ACTIVE and absorbed "Australian
  # Defence Force" as a conflict; `org:the-air-force` coined the alias "TAF".
  # The corpus already holds five different air forces and navies.
  - { surface: Defence, reason: "names no particular ministry or service" }
  - { surface: Defense, reason: "names no particular ministry or service" }
  - surface: the Navy
    reason: "US, Royal, German -- the article decides"
    readings: [unit:u-s-navy, unit:royal-navy]
  - surface: the Army
    reason: "US, Australian, Ukrainian -- the article decides"
    readings: [unit:u-s-army, unit:british-army]
  - surface: the Air Force
    reason: "US, Italian, Ukrainian -- the article decides"
    readings: [unit:u-s-air-force, unit:royal-air-force]
  - surface: Ministry of Defence
    reason: "names no particular ministry; the corpus holds several"
    readings: [govt:ministry-of-defence, govt:dutch-ministry-of-defence]
  # No readings: the two it carried were merged away, and followed to their
  # survivors they picked Israel's ministry for a story about an unnamed NATO
  # member's, because the supplier was Israeli. A home country is weak evidence
  # for a ministry.
  - surface: Ministry of Defense
    reason: "names no particular ministry; the corpus holds several"

  # Each of these held one entity that collected several countries' bodies:
  # every one of its fifteen mentions on 2026-10-25 was a specific ministry
  # (Japan, India, Ukraine, Russia, Thailand, Taiwan, Germany) and every one
  # was linked to the catch-all. No readings, because the ministries an
  # article could mean mostly carry no home country to pick them by, and a
  # replay picked none: declining is the same outcome without a wrong pick.
  - { surface: Defense Ministry, reason: "names no particular ministry; the article decides" }
  - { surface: Defence Ministry, reason: "names no particular ministry; the article decides" }
  - { surface: the Defense Ministry, reason: "names no particular ministry; the article decides" }
  - { surface: the Defence Ministry, reason: "names no particular ministry; the article decides" }
  - { surface: Aeronautics, reason: "Saab's business area and Rafael's drone maker both write it bare" }
  - { surface: Marine, reason: "an adjective in every mention: Marine snipers, Marine units" }
  - { surface: the Department, reason: "whichever department the article is about" }

  # New in v3: each minted an Organization and each is a category error -- a
  # publisher we read, a conference, a city hosting a depot. Belt to the
  # ontology guidance's braces.
  - { surface: War on the Rocks, reason: "a publisher we read, not an actor" }
  - { surface: Breaking Defense, reason: "a publisher we read, not an actor" }
  - { surface: DefenseScoop, reason: "a publisher we read, not an actor" }
  - { surface: Forge, reason: "multiple products and program offices" }
  - { surface: Hunter, reason: "multiple programs and products" }
