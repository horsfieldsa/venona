  # ── the defence-industry trunk ──────────────────────────────────────
  # 248 entities, declared rather than extracted. Measured on the first full
  # run, 727 of 1,036 resolved surfaces MINTED a new entity -- each a
  # provisional with one alias and a fair chance of colliding tomorrow, which is
  # where 73 conflicts and 620 provisionals on day one came from. Every name
  # here is a mint that does not happen, and it also fills the gazetteer, so it
  # improves EXTRACTION before resolution is reached.
  #
  # IDENTITY, NEVER DEFINITIONS (invariant 3): nothing here carries a summary,
  # and a seeded entity renders as visibly undefined until an article defines it.
  #
  # THREE RULES when adding to this.
  #
  #   1. `relevance` is load-bearing: the gazetteer sorts by it and cuts at
  #      `llm.gazetteer_size`, so an anchor left at 0 never reaches the prompt.
  #   2. `name_strictness: 0` on anything whose name is an ordinary word --
  #      Fury, Bolt, Foundry, Sentinel, Planet, Raft. See the countries above.
  #   3. An acronym alias gets strictness 2, the case-SENSITIVE tier.
  #      `AIA` must not match "aia" inside a longer word, and `RAND` must not
  #      match `rand` in engineering copy.
  #
  # A wrong alias is more expensive than a missing one: a missing one lands in
  # the review queue, a wrong one silently merges two organisations.

  # ── companies ──
